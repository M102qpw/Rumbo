<style>
  :root {
    --papel: #FBF7F2; --tinta: #2B2622; --suave: #6E645B; --linea: #E6DDD2;
    --terracota: #C2553D; --terracota-claro: #F6DCD3; --oliva: #2E7D5B; --oliva-claro: #D5EADF;
    --superficie: #FFFFFF; --sombra: 0 6px 24px rgba(43,38,34,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #1C1916; --tinta: #EDE3DA; --suave: #B5AA9F; --linea: #3A342F;
      --terracota: #F0A08B; --terracota-claro: #5A2A1E; --oliva: #8FD3B0; --oliva-claro: #1F3B2E;
      --superficie: #26221E; --sombra: 0 6px 24px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--papel); color: var(--tinta); font-size: 16px; line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--terracota); outline-offset: 2px; }

  .app { display: grid; grid-template-rows: auto auto 1fr; height: 100dvh; }
  header { padding: 14px 18px 6px; }
  header h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
  .quien { margin: 4px 0 0; color: var(--suave); font-size: .9rem; }

  .dias { display: flex; gap: 8px; overflow-x: auto; padding: 8px 18px 10px; scrollbar-width: none; }
  .dias button {
    border: 1.5px solid var(--linea); background: transparent; border-radius: 999px;
    padding: 6px 14px; white-space: nowrap;
  }
  .dias button[aria-pressed="true"] { background: var(--oliva-claro); border-color: var(--oliva); font-weight: 600; }

  .cuerpo { display: grid; grid-template-rows: 46vh 1fr; min-height: 0; }
  @media (min-width: 900px) { .cuerpo { grid-template-rows: none; grid-template-columns: 1fr 440px; } }

  .mapa-caja { position: relative; min-height: 0; }
  #mapa { position: absolute; inset: 0; }
  .buscador { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2; max-width: 460px; }
  .buscador input {
    width: 100%; border: none; border-radius: 999px; padding: 11px 18px;
    background: var(--superficie); box-shadow: var(--sombra);
  }
  .resultados { margin-top: 6px; background: var(--superficie); border-radius: 14px; box-shadow: var(--sombra); overflow: hidden; }
  .resultados button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 16px; border-top: 1px solid var(--linea); }
  .resultados button:first-child { border-top: 0; }
  .resultados small { display: block; color: var(--suave); }
  .pista {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 2;
    background: var(--superficie); padding: 7px 14px; border-radius: 999px; box-shadow: var(--sombra); font-size: .9rem;
  }

  .panel { overflow-y: auto; min-height: 0; border-top: 1px solid var(--linea); background: var(--papel); }
  @media (min-width: 900px) { .panel { border-top: 0; border-left: 1px solid var(--linea); } }

  .resumen { position: sticky; top: 0; z-index: 1; background: var(--terracota-claro); padding: 10px 18px; font-size: .92rem; }
  .resumen .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .resumen label { display: inline-flex; align-items: center; gap: 6px; }
  .resumen input[type=time] { border: 1px solid var(--linea); border-radius: 8px; padding: 2px 6px; background: var(--superficie); }

  ol.paradas { list-style: none; margin: 0; padding: 0 0 80px; }
  .parada { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 12px 14px 10px 14px; }
  .num {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--terracota); color: #fff; font-weight: 700; font-size: .9rem; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .parada.visitada .num { background: var(--oliva); }
  .parada.visitada .nombre { text-decoration: line-through; color: var(--suave); }
  .nombre { font-weight: 600; font-size: 1.05rem; border: 0; background: none; padding: 0; text-align: left; }
  .detalle { color: var(--suave); font-size: .88rem; margin-top: 2px; }
  .acciones { display: flex; gap: 2px; align-items: center; }
  .acciones button, .icono {
    width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent; font-size: 1rem;
  }
  .acciones button:hover:not(:disabled) { background: var(--linea); }
  .acciones button:disabled { opacity: .25; cursor: default; }
  .visto { margin-top: 6px; display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--suave); }
  .tramo { margin: 0 14px 0 54px; padding: 4px 0 8px; color: var(--suave); font-size: .85rem; border-left: 2px dashed var(--linea); padding-left: 14px; }
  .tramo b { font-weight: 600; color: var(--tinta); }
  .tramo button.cambiar { all: unset; cursor: pointer; display: block; width: 100%; }
  .tramo button.cambiar:hover b { text-decoration: underline; }
  .tramo button.cambiar:focus-visible { outline: 3px solid var(--terracota); outline-offset: 2px; border-radius: 6px; }
  .tramo .editar { float: right; opacity: .6; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips button { border: 1.5px solid var(--linea); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: .9rem; }
  .chips button[aria-pressed="true"] { background: var(--oliva-claro); border-color: var(--oliva); font-weight: 600; }
  .boton.ancho { width: 100%; margin-top: 10px; }
  .nota { font-size: .85rem; color: var(--suave); margin: 8px 0 0; }
  .paso { border: 1.5px solid var(--linea); border-radius: 14px; padding: 10px 12px; margin-top: 10px; }
  .paso .cabeza { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: .9rem; }
  .opcion { display: block; width: 100%; text-align: left; border: 1.5px solid var(--linea); border-radius: 14px; background: var(--papel); padding: 10px 12px; margin-top: 10px; }
  .opcion:hover { border-color: var(--terracota); }
  .opcion .horas { font-weight: 700; font-size: 1.05rem; }
  .opcion .pasos { margin-top: 4px; }
  .opcion small { display: block; color: var(--suave); margin-top: 2px; }
  .barra-modo {
    position: absolute; left: 10px; right: 10px; bottom: 12px; z-index: 3; max-width: 520px; margin: 0 auto;
    background: var(--superficie); border-radius: 18px; box-shadow: var(--sombra); padding: 12px 14px;
  }
  .barra-modo p { margin: 2px 0 8px; font-size: .88rem; color: var(--suave); }
  .barra-modo .botones { margin-top: 6px; }
  dialog .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vacio { padding: 28px 18px; color: var(--suave); }

  dialog {
    border: 0; border-radius: 22px; padding: 22px; width: min(420px, 92vw);
    background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra);
  }
  dialog::backdrop { background: rgba(28,25,22,.45); }
  dialog h2 { margin: 0 0 14px; font-size: 1.3rem; }
  dialog label { display: block; font-size: .85rem; color: var(--suave); margin-top: 10px; }
  dialog input, dialog textarea, dialog select {
    width: 100%; margin-top: 4px; padding: 10px 12px; border: 1.5px solid var(--linea); border-radius: 12px; background: var(--papel);
  }
  .botones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .boton { border: 0; border-radius: 999px; padding: 9px 18px; background: var(--terracota); color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .boton { color: #2B1208; } }
  .boton.secundario { background: transparent; color: var(--tinta); border: 1.5px solid var(--linea); }
  .boton.peligro { background: transparent; color: #C0392B; margin-right: auto; padding-left: 0; }
  .centro { display: grid; place-items: center; height: 100dvh; padding: 24px; text-align: center; }
  .centro p { max-width: 34ch; color: var(--suave); }
  .atribucion { padding: 6px 18px 24px; font-size: .75rem; color: var(--suave); }
  .atribucion a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="raiz"><div class="centro"><p>Abriendo el viaje…</p></div></div>

<dialog id="dlgParada">
  <form method="dialog" id="formParada">
    <h2 id="tituloParada">Nueva parada</h2>
    <label>Tipo<select name="categoria">
      <option value="visita">📍 Visita</option><option value="comida">🍽️ Comida</option><option value="hotel">🏨 Hotel</option>
      <option value="aeropuerto">🛫 Aeropuerto</option><option value="estacion">🚉 Estación</option><option value="otro">⭐ Otro</option>
    </select></label>
    <label>Nombre<input name="nombre" required autocomplete="off"></label>
    <label>Tiempo de visita (minutos)<input name="minutos" type="number" min="0" max="999" inputmode="numeric"></label>
    <div class="fila2">
      <label>Hora de reserva<input name="horaReserva" type="time"></label>
      <label>Código / localizador<input name="codigo" autocomplete="off"></label>
    </div>
    <label>Notas<textarea name="notas" rows="2"></textarea></label>
    <label>Día<select name="dia"></select></label>
    <div class="botones">
      <button type="button" class="boton peligro" id="btnBorrar" hidden>Borrar parada</button>
      <button type="button" class="boton secundario" id="btnMover" hidden>📍 Mover en el mapa</button>
      <button type="button" class="boton secundario" id="btnCancelar">Cancelar</button>
      <button type="submit" class="boton">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgTramo">
  <form method="dialog" id="formTramo">
    <h2 id="tituloTramo"></h2>
    <button type="button" class="boton ancho" id="btnSugerir">✨ Sugerir rutas en transporte</button>
    <p class="nota">O elige tú cómo vais:</p>
    <div class="chips" id="chipsTipo"></div>
    <div id="camposTramo"></div>
    <label>Notas<textarea name="notas" rows="2" placeholder="Billete, salida del metro…"></textarea></label>
    <div class="botones">
      <button type="button" class="boton secundario" id="btnCancelarTramo">Cancelar</button>
      <button type="submit" class="boton" id="btnGuardarTramo">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSugerencias">
  <h2 id="tituloSug"></h2>
  <div class="fila2">
    <label>Fecha<input type="date" id="sugFecha"></label>
    <label>Salida<input type="time" id="sugHora"></label>
  </div>
  <div id="sugResultados"></div>
  <p class="nota"><a href="https://transitous.org/sources/" target="_blank" rel="noopener" style="color:inherit">Horarios: Transitous y sus fuentes</a> · Mapa © OpenStreetMap</p>
  <div class="botones"><button type="button" class="boton secundario" id="btnCerrarSug">Cerrar</button></div>
</dialog>

<dialog id="dlgNombre">
  <form method="dialog" id="formNombre">
    <h2>¿Cómo te llamas?</h2>
    <p style="margin:0;color:var(--suave)">Así los demás sabrán quién se ha unido al viaje.</p>
    <label>Tu nombre<input name="nombre" required autocomplete="given-name"></label>
    <div class="botones"><button type="submit" class="boton">Entrar al viaje</button></div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, addDoc, writeBatch,
  arrayUnion, serverTimestamp, deleteField, GeoPoint
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Configuración web del proyecto Rumbo en Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCcjkUvDliUsW31se-rAlXUxZT2WPZ-NHg",
  authDomain: "rumbo-70cd2.firebaseapp.com",
  projectId: "rumbo-70cd2",
  storageBucket: "rumbo-70cd2.firebasestorage.app",
  messagingSenderId: "972946933469",
  appId: "1:972946933469:web:e46ebd5d5763ee62c23d34"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- Estado ----------
let uid = null, viajeId = null, viaje = null, paradas = [], dia = 1;
let mapa = null, mapaListo = false, encuadradoDia = null;
const rutasCache = new Map();
let editando = null;      // parada que se edita
let nuevoPunto = null;    // {lat,lng} para parada nueva
let modo = null;          // {tipo:'dibujo'|'ajuste'|'alternativas', a, b, cfg, puntos, opciones, elegida}
let ultimoDelDia = [], ultimasHoras = [];
let featuresParadas = [];

const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const raiz = $("#raiz");

// ---------- Formatos ----------
const fMin = (m) => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return h === 0 ? `${r} min` : r === 0 ? `${h} h` : `${h} h ${r} min`; };
const fDist = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace(".", ",")} km`;
const fHora = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const leerHora = (t) => { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const distancia = (a, b) => {
  const R = 6371000, r = (x) => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const coord = (g) => ({ lat: g.latitude ?? g.lat, lng: g.longitude ?? g.lng });

const CATEGORIA = { visita: "", comida: "🍽️", hotel: "🏨", aeropuerto: "🛫", estacion: "🚉", otro: "⭐" };
function etiquetaDia(d) {
  if (!viaje?.fechaInicio) return `Día ${d}`;
  const f = new Date(viaje.fechaInicio + "T12:00:00"); f.setDate(f.getDate() + d - 1);
  return `Día ${d} · ${f.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }).replace(/\./g, "")}`;
}
const ICONO = { avion: "✈️", andando: "🚶", pasaje: "🪜", bus: "🚌", metro: "🚇", tren: "🚆", tranvia: "🚊", taxi: "🚕", barco: "⛴️", ruta: "🔀" };
const NOMBRE = { avion: "Avión", andando: "Andando", pasaje: "Pasaje", bus: "Bus", metro: "Metro", tren: "Tren", tranvia: "Tranvía", taxi: "Taxi", barco: "Barco", ruta: "Varios pasos" };
const COLOR = { avion: "#4F86B8", alternativa: "#9E9A94", andando: "#C2553D", pasaje: "#8C6A4F", bus: "#2F6DB5", metro: "#6B4FA0", tren: "#3D7A3D", tranvia: "#D08A1E", taxi: "#C9A100", barco: "#1E8A9A" };
const esPublico = (t) => ["bus", "metro", "tren", "tranvia", "barco", "avion"].includes(t);

// ---------- Arranque ----------
const codigo = (new URLSearchParams(location.search).get("v") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
if (!codigo) {
  raiz.innerHTML = `<div class="centro"><div><h1>Rumbo</h1><p>Abre el enlace que te han enviado para ver el viaje, o escribe aquí su código.</p>
    <form id="fCodigo"><input name="c" maxlength="9" placeholder="ABCD EFGH" style="padding:10px 14px;border-radius:12px;border:1.5px solid var(--linea);text-transform:uppercase;text-align:center;font-size:1.3rem"> <button class="boton">Abrir</button></form></div></div>`;
  $("#fCodigo").addEventListener("submit", (e) => {
    e.preventDefault();
    location.search = "?v=" + e.target.c.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  });
} else {
  onAuthStateChanged(auth, async (u) => {
    if (!u) { signInAnonymously(auth).catch(mostrarError); return; }
    if (uid) return;
    uid = u.uid;
    try { await entrar(); } catch (e) { mostrarError(e); }
  });
}

function mostrarError(e) {
  console.error(e);
  raiz.innerHTML = `<div class="centro"><div><h1>No se ha podido abrir el viaje</h1>
    <p>Comprueba que el enlace está completo y que tienes conexión. Si sigue sin ir, pide a quien te lo envió un enlace nuevo.</p></div></div>`;
}

async function entrar() {
  const inv = await getDoc(doc(db, "invitaciones", codigo));
  if (!inv.exists()) throw new Error("Código no válido");
  viajeId = inv.data().viajeId;
  const ref = doc(db, "viajes", viajeId);
  await updateDoc(ref, { miembros: arrayUnion(uid), codigoUsado: codigo });

  let nombre = localStorage.getItem("rumbo-nombre");
  if (!nombre) nombre = await pedirNombre();
  localStorage.setItem("rumbo-nombre", nombre);
  updateDoc(ref, { [`nombres.${uid}`]: nombre }).catch(console.warn);

  montar();
  onSnapshot(ref, (s) => { viaje = s.data(); if (!viaje) return; pintar(); });
  onSnapshot(collection(ref, "paradas"), (s) => {
    paradas = s.docs.map(d => ({ id: d.id, ...d.data() }));
    pintar();
  });
}

function pedirNombre() {
  return new Promise((resolver) => {
    const dlg = $("#dlgNombre");
    $("#formNombre").onsubmit = (e) => { e.preventDefault(); const n = e.target.nombre.value.trim(); if (n) { dlg.close(); resolver(n); } };
    dlg.showModal();
  });
}

// ---------- Estructura ----------
function montar() {
  raiz.innerHTML = `
  <div class="app">
    <header><h1 id="titulo"></h1><p class="quien" id="quien"></p></header>
    <nav class="dias" id="dias" aria-label="Días del viaje"></nav>
    <div class="cuerpo">
      <div class="mapa-caja">
        <div id="mapa"></div>
        <div class="buscador">
          <input id="busca" type="search" placeholder="Buscar un sitio para añadir" autocomplete="off" aria-label="Buscar un sitio">
          <div class="resultados" id="resultados" hidden></div>
        </div>
        <div class="pista" id="pista">Toca el mapa para añadir una parada</div>
        <div class="barra-modo" id="barraModo" hidden></div>
      </div>
      <section class="panel">
        <div class="resumen" id="resumen"></div>
        <ol class="paradas" id="lista"></ol>
        <p class="atribucion">Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · OpenFreeMap · Rutas a pie: FOSSGIS · Búsqueda: Photon<br>Versión 8 (mover copias)</p>
      </section>
    </div>
  </div>`;

  mapa = new maplibregl.Map({
    container: "mapa",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [-3.7038, 40.4168], zoom: 12, attributionControl: { compact: true }
  });
  mapa.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
  mapa.on("load", () => {
    mapa.addSource("rutas", { type: "geojson", data: vacio() });
    mapa.addSource("paradas", { type: "geojson", data: vacio() });
    mapa.addSource("marcas", { type: "geojson", data: vacio() });
    const colorPorTipo = ["match", ["get", "tipo"], ...Object.entries(COLOR).flat(), "#C2553D"];
    mapa.addLayer({ id: "ruta", type: "line", source: "rutas", filter: ["==", ["get", "calc"], true],
      layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": colorPorTipo, "line-width": 4, "line-opacity": .85 } });
    mapa.addLayer({ id: "ruta-recta", type: "line", source: "rutas", filter: ["==", ["get", "calc"], false],
      layout: { "line-cap": "round" }, paint: { "line-color": colorPorTipo, "line-width": 3, "line-opacity": .6, "line-dasharray": [2, 1.5] } });
    mapa.addLayer({ id: "marcas", type: "circle", source: "marcas",
      paint: { "circle-radius": 7, "circle-color": "#fff", "circle-stroke-width": 3, "circle-stroke-color": "#C2553D" } });
    mapa.addLayer({ id: "paradas", type: "circle", source: "paradas",
      paint: { "circle-radius": 12, "circle-color": ["case", ["get", "visitada"], "#2E7D5B", "#C2553D"], "circle-stroke-width": 2.5, "circle-stroke-color": "#fff" } });
    mapa.addLayer({ id: "numeros", type: "symbol", source: "paradas",
      layout: { "text-field": ["to-string", ["get", "orden"]], "text-font": ["Noto Sans Bold"], "text-size": 12, "text-allow-overlap": true, "text-ignore-placement": true },
      paint: { "text-color": "#fff" } });
    mapaListo = true;
    pintar();
  });
  mapa.on("click", (e) => {
    if (window.__seAcabaDeArrastrar?.()) return; // el clic que viene al soltar no abre nada
    if (modo) { clicEnModo({ lat: e.lngLat.lat, lng: e.lngLat.lng }); return; }
    const toc = mapa.queryRenderedFeatures([[e.point.x - 14, e.point.y - 14], [e.point.x + 14, e.point.y + 14]], { layers: ["paradas"] });
    if (toc.length) { const p = paradas.find(x => x.id === toc[0].properties.id); if (p) abrirEditar(p); return; }
    abrirNueva({ lat: e.lngLat.lat, lng: e.lngLat.lng }, "");
  });

  // Buscador (Photon, mientras escribes)
  let temporizador = null;
  $("#busca").addEventListener("input", (e) => {
    clearTimeout(temporizador);
    const q = e.target.value.trim();
    if (q.length < 3) { $("#resultados").hidden = true; return; }
    temporizador = setTimeout(() => buscar(q), 450);
  });

  $("#btnCancelar").onclick = () => $("#dlgParada").close();
  $("#formParada").onsubmit = guardarParada;
  $("#btnBorrar").onclick = borrarParada;
  $("#btnMover").onclick = () => {
    const p = editando; $("#dlgParada").close();
    modo = { tipo: "mover", parada: p, a: p, b: p, puntos: [] };
    pintar();
  };

  // Arrastrar paradas (ratón y dedo)
  let arrastre = null, ultimoArrastre = 0;
  const empezarArrastre = (e) => {
    if (modo || !e.features?.length) return;
    if (e.type === "touchstart" && e.points?.length !== 1) return;
    e.preventDefault(); // que no se mueva el mapa mientras arrastras
    arrastre = { id: e.features[0].properties.id, inicio: e.point, movido: false, lngLat: e.lngLat };
    mapa.getCanvas().style.cursor = "grabbing";
    const mover = (ev) => {
      if (!arrastre) return;
      if (Math.hypot(ev.point.x - arrastre.inicio.x, ev.point.y - arrastre.inicio.y) > 4) arrastre.movido = true;
      arrastre.lngLat = ev.lngLat;
      const datos = { type: "FeatureCollection", features: featuresParadas.map(f => f.properties.id === arrastre.id
        ? { ...f, geometry: { type: "Point", coordinates: [ev.lngLat.lng, ev.lngLat.lat] } } : f) };
      mapa.getSource("paradas").setData(datos);
    };
    const soltar = async () => {
      mapa.off(e.type === "touchstart" ? "touchmove" : "mousemove", mover);
      mapa.getCanvas().style.cursor = "";
      const a = arrastre; arrastre = null;
      if (!a?.movido) return;
      ultimoArrastre = Date.now();
      await moverParada(a.id, a.lngLat.lat, a.lngLat.lng);
    };
    mapa.on(e.type === "touchstart" ? "touchmove" : "mousemove", mover);
    mapa.once(e.type === "touchstart" ? "touchend" : "mouseup", soltar);
  };
  mapa.on("mousedown", "paradas", empezarArrastre);
  mapa.on("touchstart", "paradas", empezarArrastre);
  mapa.on("mouseenter", "paradas", () => { if (!arrastre) mapa.getCanvas().style.cursor = "grab"; });
  mapa.on("mouseleave", "paradas", () => { if (!arrastre) mapa.getCanvas().style.cursor = ""; });
  window.__seAcabaDeArrastrar = () => Date.now() - ultimoArrastre < 400;
  $("#btnCancelarTramo").onclick = () => $("#dlgTramo").close();
  $("#formTramo").onsubmit = (e) => { e.preventDefault(); guardarTramo(configFormulario()); $("#dlgTramo").close(); };
  $("#btnCerrarSug").onclick = () => $("#dlgSugerencias").close();
}

const vacio = () => ({ type: "FeatureCollection", features: [] });

async function buscar(q) {
  const c = mapa.getCenter();
  try {
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${c.lat}&lon=${c.lng}`);
    const j = await r.json();
    const caja = $("#resultados");
    caja.innerHTML = j.features.map((f, i) => {
      const p = f.properties;
      const nombre = p.name || [p.street, p.housenumber].filter(Boolean).join(" ") || "Sin nombre";
      const detalle = [p.street, p.city, p.country].filter(x => x && x !== nombre).join(", ");
      return `<button type="button" data-i="${i}">📍 ${esc(nombre)}<small>${esc(detalle)}</small></button>`;
    }).join("") || `<button type="button" disabled>No hay resultados</button>`;
    caja.hidden = false;
    caja.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => {
      const f = j.features[+b.dataset.i];
      const [lng, lat] = f.geometry.coordinates;
      caja.hidden = true; $("#busca").value = "";
      mapa.flyTo({ center: [lng, lat], zoom: 16 });
      abrirNueva({ lat, lng }, f.properties.name || "");
    });
  } catch { $("#resultados").innerHTML = `<button type="button" disabled>No se pudo buscar. ¿Tienes conexión?</button>`; $("#resultados").hidden = false; }
}

// ---------- Tramos ----------
function configDe(a, b) { return a.tramo && a.tramo.destinoId === b.id ? a.tramo : null; }

async function rutaAPie(a, b, porDonde = [], alt = 0) {
  const pts = [{ lat: a.lat, lng: a.lng }, ...porDonde, { lat: b.lat, lng: b.lng }];
  const clave = pts.map(p => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`).join(";") + "#" + alt;
  if (rutasCache.has(clave)) return rutasCache.get(clave);
  const coords = pts.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(";");
  const pedirAlt = alt > 0 && porDonde.length === 0;
  const r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${coords}?overview=full&geometries=geojson${pedirAlt ? "&alternatives=3" : ""}`);
  const j = await r.json();
  if (j.code !== "Ok") throw new Error("sin ruta");
  const ruta = j.routes[pedirAlt ? Math.min(alt, j.routes.length - 1) : 0];
  const res = { metros: ruta.distance, segundos: ruta.duration, coords: ruta.geometry.coordinates };
  rutasCache.set(clave, res);
  return res;
}

async function calcularTramo(a, b) {
  const c = configDe(a, b);
  const tipo = c?.tipo || "andando";
  const recta = [[a.lng, a.lat], [b.lng, b.lat]];
  if (tipo === "andando") {
    try {
      const r = await rutaAPie(a, b, (c?.porDonde || []).map(coord), c?.alternativa || 0);
      return { tipo, metros: r.metros, segundos: r.segundos, aPieM: r.metros, aPieS: r.segundos, lineas: [{ coords: r.coords, tipo, calc: true }],
        texto: `${fDist(r.metros)} · ${fMin(r.segundos / 60)}`,
        etiqueta: (c?.porDonde || []).length ? "por tu camino" : (c?.alternativa > 0 ? `alternativa ${c.alternativa + 1}` : ""),
        sub: esc(c?.notas || "") };
    } catch {
      const m = distancia(a, b) * 1.3;
      return { tipo, metros: m, segundos: m / 1.25, aPieM: m, aPieS: m / 1.25, lineas: [{ coords: recta, tipo, calc: false }], texto: `≈ ${fDist(m)} · ${fMin(m / 75)}` };
    }
  }
  if (tipo === "pasaje") {
    const camino = [{ lat: a.lat, lng: a.lng }, ...(c.puntos || []).map(coord), { lat: b.lat, lng: b.lng }];
    let m = 0; for (let i = 1; i < camino.length; i++) m += distancia(camino[i - 1], camino[i]);
    const s = c.minutos > 0 ? c.minutos * 60 : m / 1.25;
    return { tipo, metros: m, segundos: s, aPieM: m, aPieS: s, lineas: [{ coords: camino.map(p => [p.lng, p.lat]), tipo, calc: true }],
      texto: `Pasaje · ${fDist(m)} · ${fMin(s / 60)}` };
  }
  if (tipo === "ruta") {
    const pasos = c.pasos || [];
    const total = (pasos.reduce((x, p) => x + (p.minutos || 0), 0) + (c.esperaMin || 0)) * 60;
    const aPie = pasos.filter(p => p.tipo === "andando");
    const conCamino = pasos.filter(p => (p.puntos || []).length >= 2);
    const lineas = conCamino.length
      ? conCamino.map(p => ({ coords: p.puntos.map(coord).map(q => [q.lng, q.lat]), tipo: p.tipo, calc: true }))
      : [{ coords: recta, tipo: (pasos.find(p => p.tipo !== "andando") || {}).tipo || "andando", calc: false }];
    return {
      tipo, metros: distancia(a, b), segundos: total, aPieM: aPie.reduce((x, p) => x + (p.metros || 0), 0), aPieS: aPie.reduce((x, p) => x + (p.minutos || 0), 0) * 60,
      lineas, fija: leerHora(c.horaSalida),
      texto: pasos.map(p => `${ICONO[p.tipo] || "•"} ${p.tipo === "andando" || !p.linea ? (p.minutos || 0) + "′" : esc(p.linea)}`).join(" › ") + ` · ${fMin(total / 60)}`,
      sub: c.horaSalida ? `Sale ${c.horaSalida}` : ""
    };
  }
  // bus, metro, tren, tranvía, avión, taxi (a mano)
  const sale = leerHora(c.horaSalida), llega = leerHora(c.horaLlegada);
  const espera = esPublico(tipo) && sale == null ? (c.frecuencia || 0) / 2 : 0;
  const min = sale != null && llega != null ? (((llega - sale) % 1440) + 1440) % 1440 : (c.minutos || 0) + espera;
  const s = min * 60;
  return {
    tipo, metros: distancia(a, b), segundos: s, aPieM: 0, aPieS: 0, lineas: [{ coords: recta, tipo, calc: false }],
    fija: sale, llegaFija: sale != null ? llega : null,
    texto: `${NOMBRE[tipo]}${c.linea ? " " + esc(c.linea) : ""} · ` + (sale != null
      ? `${fHora(sale)}${llega != null ? " → " + fHora(llega) : ""}`
      : `${fMin(c.minutos || 0)}${espera ? ` + ≈${Math.round(espera)} min espera` : ""}`),
    sub: [c.subida || c.bajada ? `${esc(c.subida || "?")} → ${esc(c.bajada || "?")}` : "", esc(c.notas || "")].filter(Boolean).join(" · ")
  };
}

// ---------- Pintar ----------
let pintando = 0;
async function pintar() {
  if (!viaje || !$("#titulo")) return;
  const turno = ++pintando;
  const numDias = viaje.numDias || 1;
  if (dia > numDias) dia = 1;

  $("#titulo").textContent = viaje.nombre || "Viaje";
  const nombres = Object.values(viaje.nombres || {});
  $("#quien").textContent = nombres.length ? `Con ${nombres.join(", ")}` : "";

  const nav = $("#dias");
  nav.innerHTML = numDias > 1 ? Array.from({ length: numDias }, (_, i) => `<button type="button" aria-pressed="${i + 1 === dia}" data-d="${i + 1}">${etiquetaDia(i + 1)}</button>`).join("") : "";
  nav.querySelectorAll("button").forEach(b => b.onclick = () => { dia = +b.dataset.d; pintar(); });

  const delDia = paradas.filter(p => (p.dia || 1) === dia).sort((x, y) => (x.orden || 0) - (y.orden || 0));
  $("#pista").hidden = delDia.length > 0 || !!modo;

  const tramos = await Promise.all(delDia.slice(0, -1).map((p, i) => calcularTramo(p, delDia[i + 1])));
  // Modos de mapa: sustituir la línea del tramo que se está tocando
  if (modo) {
    const i = delDia.findIndex(p => p.id === modo.a.id);
    if (i >= 0 && delDia[i + 1]?.id === modo.b.id) {
      const { a, b } = modo;
      if (modo.tipo === "dibujo") {
        const camino = [a, ...modo.puntos, b].map(p => [p.lng, p.lat]);
        tramos[i] = { ...tramos[i], lineas: [{ coords: camino, tipo: "pasaje", calc: true }] };
      } else if (modo.tipo === "ajuste") {
        try {
          const r = await rutaAPie(a, b, modo.puntos);
          modo.previa = r;
          tramos[i] = { ...tramos[i], lineas: [{ coords: r.coords, tipo: "andando", calc: true }] };
        } catch { /* se queda la línea anterior */ }
      } else if (modo.tipo === "alternativas" && modo.opciones?.length) {
        tramos[i] = { ...tramos[i], lineas: [
          ...modo.opciones.filter((_, j) => j !== modo.elegida).map(o => ({ coords: o.coords, tipo: "alternativa", calc: true })),
          { coords: modo.opciones[modo.elegida].coords, tipo: "andando", calc: true }
        ] };
      }
    }
  }
  if (turno !== pintando) return; // llegó otra actualización mientras calculaba

  // Horario
  const salida = leerHora((viaje.horasSalida || {})[String(dia)]);
  const horas = []; let reloj = salida;
  delDia.forEach((p, i) => {
    if (salida == null) return;
    if (i > 0) {
      const t = tramos[i - 1];
      if (t.fija != null) { if (t.fija >= reloj) reloj = t.fija; else t.tarde = true; }
      reloj = t.fija != null && t.llegaFija != null ? t.llegaFija : reloj + t.segundos / 60;
    }
    const reserva = leerHora(p.horaReserva);
    if (reserva != null) { if (reloj > reserva) p._tarde = true; else { reloj = reserva; p._tarde = false; } } else p._tarde = false;
    const lle = reloj; reloj += p.minutosVisita || 0; horas.push([lle, reloj]);
  });

  ultimoDelDia = delDia; ultimasHoras = horas;
  pintarBarraModo();
  if (mapaListo) mapa.getSource("marcas").setData({ type: "FeatureCollection",
    features: (modo?.tipo === "ajuste" ? modo.puntos : []).map(p => ({ type: "Feature", geometry: { type: "Point", coordinates: [p.lng, p.lat] }, properties: {} })) });

  // Resumen
  const aPieM = tramos.reduce((x, t) => x + t.aPieM, 0), aPieS = tramos.reduce((x, t) => x + t.aPieS, 0);
  const totS = tramos.reduce((x, t) => x + t.segundos, 0), visitas = delDia.reduce((x, p) => x + (p.minutosVisita || 0), 0);
  const total = totS / 60 + visitas;
  $("#resumen").innerHTML = `<div class="fila">
      <span><b>${delDia.length}</b> paradas</span>
      <span>${fDist(aPieM)} a pie (${fMin(aPieS / 60)})</span>
      ${totS - aPieS > 59 ? `<span>${fMin((totS - aPieS) / 60)} en transporte</span>` : ""}
      <span>Total ${fMin(total)}${salida != null ? `, fin hacia las ${fHora(salida + total)}` : ""}</span>
      <label>Salida <input type="time" id="horaSalida" value="${salida != null ? fHora(salida) : ""}"></label>
    </div>`;
  $("#horaSalida").onchange = (e) => updateDoc(doc(db, "viajes", viajeId), { [`horasSalida.${dia}`]: e.target.value });

  // Lista
  const lista = $("#lista");
  if (!delDia.length) {
    lista.innerHTML = `<li class="vacio">Este día aún no tiene paradas. Busca un sitio arriba o toca el mapa para añadir la primera.</li>`;
  } else {
    lista.innerHTML = delDia.map((p, i) => {
      const h = horas[i];
      const detalle = [
        h ? ((p.minutosVisita || 0) > 0 ? `${fHora(h[0])} – ${fHora(h[1])}` : fHora(h[0])) : "",
        p.minutosVisita ? `visita de ${fMin(p.minutosVisita)}` : "",
        p.horaReserva || p.codigoReserva ? `🔖 ${[esc(p.horaReserva || ""), esc(p.codigoReserva || "")].filter(Boolean).join(" · ")}` : "",
        p._tarde ? "⚠️ Llegáis tarde a la reserva" : "",
        esc(p.notas || "")
      ].filter(Boolean).join(" · ");
      const t = tramos[i];
      return `<li>
        <div class="parada ${p.visitada ? "visitada" : ""}">
          <span class="num" aria-hidden="true">${p.orden}</span>
          <div>
            <button class="nombre" data-editar="${p.id}">${CATEGORIA[p.categoria] ? CATEGORIA[p.categoria] + " " : ""}${esc(p.nombre)}</button>
            ${detalle ? `<div class="detalle">${detalle}</div>` : ""}
            <label class="visto"><input type="checkbox" data-visto="${p.id}" ${p.visitada ? "checked" : ""}> Visitado</label>
          </div>
          <div class="acciones">
            <button data-mover="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="Subir">▲</button>
            <button data-mover="${i}" data-dir="1" ${i === delDia.length - 1 ? "disabled" : ""} aria-label="Bajar">▼</button>
          </div>
        </div>
        ${t ? `<div class="tramo"><button type="button" class="cambiar" data-tramo="${i}" aria-label="Cambiar cómo vais">
          <span class="editar" aria-hidden="true">✏️</span>${ICONO[t.tipo] || "🚶"} <b>${t.texto}</b>${t.etiqueta ? ` · ${t.etiqueta}` : ""}
          ${t.tarde ? `<br>⚠️ No llegáis a tiempo a la salida de las ${esc(configDe(p, delDia[i + 1])?.horaSalida)}` : ""}${t.sub ? `<br>${t.sub}` : ""}</button></div>` : ""}
      </li>`;
    }).join("");
    lista.querySelectorAll("[data-tramo]").forEach(b => b.onclick = () => { if (!modo) abrirTramo(delDia[+b.dataset.tramo], delDia[+b.dataset.tramo + 1]); });
    lista.querySelectorAll("[data-editar]").forEach(b => b.onclick = () => abrirEditar(paradas.find(x => x.id === b.dataset.editar)));
    lista.querySelectorAll("[data-visto]").forEach(c => c.onchange = () =>
      updateDoc(doc(db, "viajes", viajeId, "paradas", c.dataset.visto), { visitada: c.checked }));
    lista.querySelectorAll("[data-mover]").forEach(b => b.onclick = () => {
      const i = +b.dataset.mover, j = i + +b.dataset.dir;
      const orden = [...delDia]; const [p] = orden.splice(i, 1); orden.splice(j, 0, p);
      guardarOrden(orden);
    });
  }

  // Mapa
  if (mapaListo) {
    featuresParadas = delDia.map(p => ({
      type: "Feature", geometry: { type: "Point", coordinates: [p.lng, p.lat] }, properties: { id: p.id, orden: p.orden, visitada: !!p.visitada } }));
    mapa.getSource("paradas").setData({ type: "FeatureCollection", features: featuresParadas });
    mapa.getSource("rutas").setData({ type: "FeatureCollection", features: tramos.flatMap(t => t.lineas.filter(l => l.coords.length >= 2).map(l => ({
      type: "Feature", geometry: { type: "LineString", coordinates: l.coords }, properties: { tipo: l.tipo, calc: l.calc } }))) });
    if (encuadradoDia !== dia && delDia.length) {
      encuadradoDia = dia;
      if (delDia.length === 1) mapa.flyTo({ center: [delDia[0].lng, delDia[0].lat], zoom: 15 });
      else {
        const b = new maplibregl.LngLatBounds();
        delDia.forEach(p => b.extend([p.lng, p.lat]));
        mapa.fitBounds(b, { padding: 60, duration: 600 });
      }
    }
  }
}

function rellenarDias(sel, actual) {
  const n = viaje.numDias || 1;
  sel.innerHTML = Array.from({ length: n }, (_, i) => `<option value="${i + 1}" ${i + 1 === actual ? "selected" : ""}>${etiquetaDia(i + 1)}</option>`).join("");
  sel.parentElement.hidden = n < 2;
}
function abrirNueva(punto, nombre) {
  editando = null; nuevoPunto = punto;
  const f = $("#formParada");
  $("#tituloParada").textContent = "Nueva parada";
  f.nombre.value = nombre; f.minutos.value = ""; f.notas.value = "";
  f.categoria.value = "visita"; f.horaReserva.value = ""; f.codigo.value = "";
  rellenarDias(f.dia, dia);
  $("#btnBorrar").hidden = true;
  $("#btnMover").hidden = true;
  $("#dlgParada").showModal();
}
function abrirEditar(p) {
  if (!p) return;
  editando = p; nuevoPunto = null;
  const f = $("#formParada");
  $("#tituloParada").textContent = "Editar parada";
  f.nombre.value = p.nombre || ""; f.minutos.value = p.minutosVisita || ""; f.notas.value = p.notas || "";
  f.categoria.value = p.categoria || "visita"; f.horaReserva.value = p.horaReserva || ""; f.codigo.value = p.codigoReserva || "";
  rellenarDias(f.dia, p.dia || 1);
  $("#btnBorrar").hidden = false;
  $("#btnMover").hidden = false;
  $("#dlgParada").showModal();
}
async function guardarParada(e) {
  e.preventDefault();
  const f = e.target;
  const datos = { nombre: f.nombre.value.trim(), minutosVisita: +f.minutos.value || 0, notas: f.notas.value.trim(),
    categoria: f.categoria.value, horaReserva: f.horaReserva.value || "", codigoReserva: f.codigo.value.trim() };
  const d = +f.dia.value || 1;
  if (!datos.nombre) return;
  const enDia = paradas.filter(p => (p.dia || 1) === d && p.id !== editando?.id);
  const sigOrden = enDia.reduce((m, p) => Math.max(m, p.orden || 0), 0) + 1;
  $("#dlgParada").close();
  if (editando) {
    const cambios = { ...datos };
    if (d !== (editando.dia || 1)) {
      cambios.dia = d; cambios.orden = sigOrden;
      const origen = paradas.filter(p => (p.dia || 1) === (editando.dia || 1) && p.id !== editando.id).sort((x, y) => x.orden - y.orden);
      guardarOrden(origen);
    }
    await updateDoc(doc(db, "viajes", viajeId, "paradas", editando.id), cambios);
  } else if (nuevoPunto) {
    await addDoc(collection(db, "viajes", viajeId, "paradas"), {
      ...datos, dia: d, orden: sigOrden, lat: nuevoPunto.lat, lng: nuevoPunto.lng, visitada: false, creado: serverTimestamp()
    });
  }
}
async function borrarParada() {
  const p = editando; if (!p) return;
  if (!confirm(`¿Borrar «${p.nombre}» para todas las personas del viaje?`)) return;
  $("#dlgParada").close();
  const lote = writeBatch(db);
  lote.delete(doc(db, "viajes", viajeId, "paradas", p.id));
  paradas.filter(x => (x.dia || 1) === (p.dia || 1) && x.id !== p.id).sort((x, y) => x.orden - y.orden)
    .forEach((x, i) => { if (x.orden !== i + 1) lote.update(doc(db, "viajes", viajeId, "paradas", x.id), { orden: i + 1 }); });
  await lote.commit();
}
/** Mueve una parada; si tiene copias (mismo nombre y sitio, p. ej. el hotel en cada día), pregunta si moverlas todas. */
async function moverParada(id, lat, lng) {
  const p = paradas.find(x => x.id === id);
  const copias = p ? paradas.filter(x => x.id !== p.id && (x.nombre || "").trim().toLowerCase() === (p.nombre || "").trim().toLowerCase()
    && distancia(x, p) < 150) : [];
  const lote = writeBatch(db);
  lote.update(doc(db, "viajes", viajeId, "paradas", id), { lat, lng });
  if (copias.length && confirm(`«${p.nombre}» aparece ${copias.length} ${copias.length === 1 ? "vez más" : "veces más"} en el viaje. ¿Mover también todas las copias al sitio nuevo?`)) {
    copias.forEach(c => lote.update(doc(db, "viajes", viajeId, "paradas", c.id), { lat, lng }));
  }
  await lote.commit();
}

function guardarOrden(lista) {
  const lote = writeBatch(db); let cambios = 0;
  lista.forEach((p, i) => { if (p.orden !== i + 1) { lote.update(doc(db, "viajes", viajeId, "paradas", p.id), { orden: i + 1 }); cambios++; } });
  if (cambios) lote.commit().catch(console.warn);
}

/** Guarda la configuración del tramo en Firestore (con GeoPoint para los puntos). */
async function guardarTramo(c) {
  const { a } = tramoForm;
  const ref = doc(db, "viajes", viajeId, "paradas", a.id);
  const gp = (lista) => (lista || []).map(p => new GeoPoint(p.lat, p.lng));
  const solo = (t, x, vacio) => t ? x : vacio;
  if (c.tipo === "andando" && !c.notas && !c.porDonde.length && !c.alternativa) {
    await updateDoc(ref, { tramo: deleteField() });
    return;
  }
  const pub = esPublico(c.tipo);
  await updateDoc(ref, { tramo: {
    destinoId: c.destinoId, tipo: c.tipo,
    linea: solo(pub, c.linea || "", ""), subida: solo(pub, c.subida || "", ""), bajada: solo(pub, c.bajada || "", ""),
    minutos: c.tipo === "andando" ? 0 : (c.minutos || 0), frecuencia: solo(pub, c.frecuencia || 0, 0),
    notas: c.notas || "",
    puntos: c.tipo === "pasaje" ? gp(c.puntos) : [],
    pasos: c.tipo === "ruta" ? c.pasos.map(p => ({
      tipo: p.tipo || "andando", linea: p.linea || "", hacia: p.hacia || "", desde: p.desde || "", hasta: p.hasta || "",
      horaSalida: p.horaSalida || "", horaLlegada: p.horaLlegada || "", minutos: p.minutos || 0, metros: p.metros || 0, puntos: gp(p.puntos)
    })) : [],
    esperaMin: c.tipo === "ruta" ? (c.esperaMin || 0) : 0,
    horaSalida: c.tipo === "ruta" || pub ? (c.horaSalida || "") : "",
    horaLlegada: pub ? (c.horaLlegada || "") : "",
    porDonde: c.tipo === "andando" ? gp(c.porDonde) : [],
    alternativa: c.tipo === "andando" ? (c.alternativa || 0) : 0
  } });
}

// =====================================================================
// Modos de mapa: dibujar pasaje, pasar por aquí, elegir alternativa
// =====================================================================
async function empezarModo(tipo) {
  const { a, b, cfg } = tramoForm;
  modo = { tipo, a, b, cfg, puntos: tipo === "ajuste" ? [...cfg.porDonde] : [], opciones: null, elegida: cfg.alternativa || 0 };
  $("#pista").hidden = true;
  pintar();
  if (tipo === "alternativas") {
    try {
      const r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${a.lng.toFixed(6)},${a.lat.toFixed(6)};${b.lng.toFixed(6)},${b.lat.toFixed(6)}?overview=full&geometries=geojson&alternatives=3`);
      const j = await r.json();
      if (j.code !== "Ok") throw new Error();
      if (modo) modo.opciones = j.routes.map(x => ({ metros: x.distance, segundos: x.duration, coords: x.geometry.coordinates }));
    } catch { if (modo) modo.opciones = []; }
    if (modo) { modo.elegida = Math.min(modo.elegida, Math.max(0, (modo.opciones?.length || 1) - 1)); pintar(); }
  }
}
function terminarModo() { modo = null; $("#barraModo").hidden = true; pintar(); }

function insertarPorDonde(a, b, lista, nuevo) {
  const cadena = [a, ...lista, b];
  let mejor = 1, coste = Infinity;
  for (let k = 1; k < cadena.length; k++) {
    const c = distancia(cadena[k - 1], nuevo) + distancia(nuevo, cadena[k]) - distancia(cadena[k - 1], cadena[k]);
    if (c < coste) { coste = c; mejor = k; }
  }
  const r = [...lista]; r.splice(mejor - 1, 0, nuevo); return r;
}

function clicEnModo(punto) {
  if (modo.tipo === "mover") {
    const p = modo.parada; terminarModo();
    moverParada(p.id, punto.lat, punto.lng);
    return;
  }
  if (modo.tipo === "dibujo") modo.puntos.push(punto);
  else if (modo.tipo === "ajuste") modo.puntos = insertarPorDonde(modo.a, modo.b, modo.puntos, punto);
  else return;
  pintar();
}

function pintarBarraModo() {
  const barra = $("#barraModo");
  if (!modo) { barra.hidden = true; return; }
  barra.hidden = false;
  if (modo.tipo === "mover") {
    barra.innerHTML = `<b>📍 Mover «${esc(modo.parada.nombre)}»</b><p>Toca en el mapa el sitio nuevo de la parada.</p>
      <div class="botones"><button type="button" class="boton secundario" id="mCancelar">Cancelar</button></div>`;
    $("#mCancelar").onclick = terminarModo;
    return;
  }
  const tit = `${esc(modo.a.nombre)} → ${esc(modo.b.nombre)}`;
  if (modo.tipo === "alternativas") {
    const ops = modo.opciones;
    barra.innerHTML = `<b>🧭 ${tit}</b>
      <p>${ops == null ? "Buscando rutas…" : !ops.length ? "No se pudieron cargar las rutas." : ops.length === 1 ? "Solo hay una ruta razonable por calles. Prueba «Pasar por aquí»." : "Elige una ruta; las demás se ven en gris."}</p>
      ${ops && ops.length > 1 ? `<div class="chips">${ops.map((o, j) => `<button type="button" data-alt="${j}" aria-pressed="${j === modo.elegida}">${j === 0 ? "Más rápida" : "Opción " + (j + 1)}, ${fDist(o.metros)}, ${fMin(o.segundos / 60)}</button>`).join("")}</div>` : ""}
      <div class="botones"><button type="button" class="boton secundario" id="mCancelar">Cancelar</button>
      <button type="button" class="boton" id="mListo" ${ops?.length ? "" : "disabled"}>Usar esta</button></div>`;
    barra.querySelectorAll("[data-alt]").forEach(b => b.onclick = () => { modo.elegida = +b.dataset.alt; pintar(); });
  } else {
    const dibujo = modo.tipo === "dibujo";
    let medida = "";
    if (dibujo) { const c = [modo.a, ...modo.puntos, modo.b]; let m = 0; for (let i = 1; i < c.length; i++) m += distancia(c[i - 1], c[i]); medida = `${modo.puntos.length} puntos, ${fDist(m)}`; }
    else if (modo.previa) medida = `${fDist(modo.previa.metros)}, ${fMin(modo.previa.segundos / 60)}`;
    barra.innerHTML = `<b>${dibujo ? "🪜" : "📍"} ${tit}</b>
      <p>${dibujo ? "Toca el mapa por donde pasa el camino, en orden." : "Toca el mapa por donde queréis pasar; la ruta se recalcula por calles."} ${medida}</p>
      <div class="botones"><button type="button" class="boton secundario" id="mDeshacer" ${modo.puntos.length ? "" : "disabled"}>Deshacer</button>
      <button type="button" class="boton secundario" id="mCancelar">Cancelar</button>
      <button type="button" class="boton" id="mListo">Listo</button></div>`;
    $("#mDeshacer").onclick = () => { modo.puntos.pop(); pintar(); };
  }
  $("#mCancelar").onclick = terminarModo;
  $("#mListo").onclick = async () => {
    const c = { ...modo.cfg };
    if (modo.tipo === "dibujo") Object.assign(c, { tipo: "pasaje", puntos: modo.puntos });
    if (modo.tipo === "ajuste") Object.assign(c, { tipo: "andando", porDonde: modo.puntos, alternativa: 0 });
    if (modo.tipo === "alternativas") Object.assign(c, { tipo: "andando", porDonde: [], alternativa: modo.elegida });
    tramoForm = { a: modo.a, b: modo.b, cfg: c };
    terminarModo();
    await guardarTramo(c);
  };
}

// =====================================================================
// Sugerencias en transporte (Transitous)
// =====================================================================
const MODO_A_TIPO = (m) => m === "WALK" ? "andando" : ["BUS", "COACH"].includes(m) ? "bus" : ["SUBWAY", "METRO"].includes(m) ? "metro"
  : ["TRAM", "CABLE_CAR", "FUNICULAR", "AERIAL_LIFT", "AREAL_LIFT"].includes(m) ? "tranvia" : m === "FERRY" ? "barco"
  : ["CAR", "ODM", "RIDE_SHARING"].includes(m) ? "taxi" : "tren";
let zonaDestino = null;

/** Diferencia (min) entre la hora de una zona horaria y UTC en ese momento. */
function desfase(fechaUtc, zona) {
  const partes = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: zona, hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(fechaUtc).map(p => [p.type, p.value]));
  const comoUtc = Date.UTC(+partes.year, +partes.month - 1, +partes.day, +partes.hour % 24, +partes.minute);
  return Math.round((comoUtc - fechaUtc.getTime()) / 60000);
}
/** "2026-12-30" + 600 min en "Europe/London" → Date (instante real) */
function instante(fecha, minutos, zona) {
  const [y, m, d] = fecha.split("-").map(Number);
  const ingenuo = Date.UTC(y, m - 1, d, Math.floor(minutos / 60), minutos % 60);
  return new Date(ingenuo - desfase(new Date(ingenuo), zona) * 60000);
}
const horaEn = (iso, zona) => new Date(iso).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: zona });

function decodificar(txt, precision) {
  const f = 10 ** precision, pts = []; let i = 0, lat = 0, lng = 0;
  while (i < txt.length) {
    for (let eje = 0; eje < 2; eje++) {
      let res = 0, sh = 0, b;
      do { b = txt.charCodeAt(i++) - 63; res |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20 && i < txt.length);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (eje === 0) lat += d; else lng += d;
    }
    pts.push({ lat: lat / f, lng: lng / f });
  }
  if (pts.length <= 150) return pts;
  const paso = pts.length / 149; return [...Array.from({ length: 149 }, (_, k) => pts[Math.floor(k * paso)]), pts.at(-1)];
}

async function consultarTransporte(a, b, fecha, minutos, zona) {
  const t = instante(fecha, minutos, zona).toISOString();
  const url = `https://api.transitous.org/api/v6/plan?fromPlace=${a.lat.toFixed(6)},${a.lng.toFixed(6)}&toPlace=${b.lat.toFixed(6)},${b.lng.toFixed(6)}` +
    `&time=${encodeURIComponent(t)}&numItineraries=5&detailedTransfers=true&language=es&fastestDirectFactor=3.0`;
  const j = await (await fetch(url)).json();
  const tz = (j.itineraries || []).flatMap(it => it.legs).map(l => l.from?.tz).find(Boolean) || null;
  const andando = j.direct?.[0]?.duration ? Math.ceil(j.direct[0].duration / 60) : null;
  return { j, tz, andando };
}

async function abrirSugerencias(a, b) {
  const dlg = $("#dlgSugerencias");
  $("#tituloSug").textContent = `${a.nombre} → ${b.nombre}`;
  const i = ultimoDelDia.findIndex(p => p.id === a.id);
  const ini = viaje.fechaInicio ? new Date(viaje.fechaInicio + "T12:00:00") : null;
  if (ini) ini.setDate(ini.getDate() + dia - 1);
  const ahora = new Date();
  $("#sugFecha").value = ini ? ini.toISOString().slice(0, 10) : "";
  const salidaPlan = ultimasHoras[i]?.[1] ?? leerHora((viaje.horasSalida || {})[String(dia)]) ?? (ahora.getHours() * 60 + ahora.getMinutes());
  $("#sugHora").value = fHora(salidaPlan);
  const buscar = () => buscarTransporte(a, b);
  $("#sugFecha").onchange = () => {
    // Guardar la fecha del viaje (día 1) para la próxima vez
    const f = new Date($("#sugFecha").value + "T12:00:00"); f.setDate(f.getDate() - (dia - 1));
    updateDoc(doc(db, "viajes", viajeId), { fechaInicio: f.toISOString().slice(0, 10) }).catch(console.warn);
    buscar();
  };
  $("#sugHora").onchange = buscar;
  dlg.showModal();
  buscar();
}

async function buscarTransporte(a, b) {
  const caja = $("#sugResultados");
  let fecha = $("#sugFecha").value;
  const minutos = leerHora($("#sugHora").value);
  if (!fecha) { caja.innerHTML = `<p class="nota">Elige qué día haréis este trayecto para buscar horarios.</p>`; return; }
  if (minutos == null) return;
  caja.innerHTML = `<p class="nota">Buscando rutas…</p>`;
  try {
    let zona = zonaDestino || Intl.DateTimeFormat().resolvedOptions().timeZone;
    let { j, tz, andando } = await consultarTransporte(a, b, fecha, minutos, zona);
    if (tz && tz !== zona) { zona = zonaDestino = tz; ({ j, andando } = await consultarTransporte(a, b, fecha, minutos, zona)); }
    let referencia = "";
    if (!(j.itineraries || []).length) {
      // Sin horarios para esa fecha: mismo día de la semana más próximo
      const objetivo = new Date(fecha + "T12:00:00").getDay(), d = new Date(); d.setHours(12);
      while (d.getDay() !== objetivo) d.setDate(d.getDate() + 1);
      const ref = d.toISOString().slice(0, 10);
      if (ref !== fecha) {
        const r2 = await consultarTransporte(a, b, ref, minutos, zona);
        if ((r2.j.itineraries || []).length) { j = r2.j; referencia = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }); }
      }
    }
    const its = j.itineraries || [];
    const opciones = its.map(it => {
      const pasos = it.legs.map(l => ({
        tipo: MODO_A_TIPO(l.mode), linea: l.routeShortName || l.displayName || "", hacia: l.headsign || "",
        desde: l.from?.name === "START" ? a.nombre : (l.from?.name || ""), hasta: l.to?.name === "END" ? b.nombre : (l.to?.name || ""),
        horaSalida: horaEn(l.startTime, zona), horaLlegada: horaEn(l.endTime, zona),
        minutos: Math.ceil((l.duration || 0) / 60), metros: l.distance || 0,
        puntos: l.legGeometry?.points ? decodificar(l.legGeometry.points, l.legGeometry.precision || 6) : []
      })).filter(p => p.tipo !== "andando" || p.minutos >= 1);
      const total = Math.ceil(it.duration / 60);
      const primer = it.legs.find(l => l.mode !== "WALK");
      let directo = "";
      if (primer?.realTime) {
        const r = Math.round((new Date(primer.startTime) - new Date(primer.scheduledStartTime)) / 60000);
        directo = r > 0 ? `🔴 En directo, ${r} min de retraso` : r < 0 ? `🟢 En directo, ${-r} min adelantado` : "🟢 En directo, a su hora";
      }
      return { salida: horaEn(it.startTime, zona), llegada: horaEn(it.endTime, zona), total, transbordos: it.transfers || 0,
        pasos, esperaMin: Math.max(0, total - pasos.reduce((x, p) => x + p.minutos, 0)), directo };
    });
    let html = andando ? `<p class="nota">🚶 Andando directamente: ${fMin(andando)}</p>` : "";
    if (referencia) html += `<p class="nota">Aún no hay horarios publicados para esa fecha. Te enseño los del ${referencia} como referencia.</p>`;
    if (!opciones.length) html += `<p class="nota">No hay rutas en transporte para este trayecto${andando ? "; andando compensa más" : ""}.</p>`;
    html += opciones.map((o, k) => `<button type="button" class="opcion" data-op="${k}">
      <span class="horas">${o.salida} → ${o.llegada}</span> <span class="nota">${fMin(o.total)}, ${o.transbordos === 0 ? "directo" : o.transbordos === 1 ? "1 transbordo" : o.transbordos + " transbordos"}</span>
      ${o.directo ? `<small>${o.directo}</small>` : ""}
      <div class="pasos">${o.pasos.map(p => `${ICONO[p.tipo]} ${p.tipo === "andando" ? p.minutos + "′" : esc(p.linea || NOMBRE[p.tipo])}`).join(" › ")}</div>
      ${o.pasos.filter(p => p.tipo !== "andando").map(p => `<small>${ICONO[p.tipo]} ${esc(p.linea)}${p.hacia ? ` (hacia ${esc(p.hacia)})` : ""}: ${p.horaSalida} ${esc(p.desde)} → ${p.horaLlegada} ${esc(p.hasta)}</small>`).join("")}
    </button>`).join("");
    caja.innerHTML = html;
    caja.querySelectorAll("[data-op]").forEach(btn => btn.onclick = async () => {
      const o = opciones[+btn.dataset.op];
      tramoForm = { a, b, cfg: copiaCfg(null, b) };
      Object.assign(tramoForm.cfg, { tipo: "ruta", pasos: o.pasos, esperaMin: o.esperaMin, horaSalida: o.salida });
      $("#dlgSugerencias").close();
      await guardarTramo(tramoForm.cfg);
    });
  } catch (e) {
    console.warn(e);
    caja.innerHTML = `<p class="nota">No se pudieron cargar las rutas. Comprueba la conexión o prueba desde la app.</p>`;
  }
}
</script>
